name: Ruff
on: [push, pull_request]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ruff
        run: pip install ruff==0.12.0

      - name: Check Linting (Ruff)
        run: ruff check .

      - name: Check Formatting (Ruff)
        run: ruff format --check .